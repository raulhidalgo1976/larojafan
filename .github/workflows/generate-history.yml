
name: Generate Historical Match Pages

on:
  push:
    branches: 
      - feature/historical-match-content
    workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/historical-match-content
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source datasets
        run: python3 validate_data.py data

      - name: Generate website
        run: python3 build.py

      - name: Validate generated website
        run: python3 validate_site.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate historical match pages"
            git push origin HEAD:feature/historical-match-content
          fi
