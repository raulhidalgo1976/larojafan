
name: Generate Website Pages

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "match_history.json"
      - "build.py"
      - "historical_corrections.csv"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build website
        run: python3 build.py

      - name: Validate generated website
        run: python3 validate_site.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate website pages"
            git push
          else
            echo "Generated pages are already current."
          fi
