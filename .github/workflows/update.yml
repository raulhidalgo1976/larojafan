name: Update matches
on:
  schedule: [{cron: '0 6 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate updated datasets
        run: |
          mkdir -p incoming
          for f in results goalscorers shootouts; do
            curl --retry 3 -fsSL -o incoming/$f.csv "https://raw.githubusercontent.com/martj42/international_results/master/$f.csv"
          done
          python3 validate_data.py incoming
          cp incoming/*.csv data/
          python3 build.py
          python3 validate_site.py
      - name: Commit changes
        run: |
          git config user.name "match-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update matches" && git push)
