name: Update matches
on:
  schedule: [{cron: '0 6 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest results and rebuild
        run: |
          for f in results goalscorers shootouts; do curl -sSfL -o data/$f.csv https://raw.githubusercontent.com/martj42/international_results/master/$f.csv; done
          python3 build.py
      - name: Commit changes
        run: |
          git config user.name "match-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update matches" && git push)
